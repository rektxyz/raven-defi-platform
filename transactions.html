<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raven DeFi | Live Transactions</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fffdf9; --bg-soft:#ffffff; --ink:#1a1406; --muted:#7a6a4a; --accent:#c41e3a; --accent-soft:#3d1218; --border:#1a140688;
    --glass-bg:rgba(255,255,255,0.82); --card-hover:#fff7e6;
  }
  [data-theme="dark"] {
    --bg:#0a0b05; --bg-soft:#111208; --ink:#fff5d6; --muted:#a08c5c; --accent:#ff4d4d; --accent-soft:#2a2322; --border:#fff7e622;
    --glass-bg:rgba(25,24,12,0.82); --card-hover:#221f16;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .serif { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: -0.02em; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 18px; }
  .site-header { position: sticky; top: 0; z-index: 90; background: var(--glass-bg); backdrop-filter: saturate(140%) blur(24px); border-bottom: 1px solid var(--border); }
  .nav-link { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.22em; padding: 10px 14px; border-radius: 12px; transition: 0.25s ease; text-transform: uppercase; }
  .nav-link:hover { color: var(--ink); background: #00000008; }
  .nav-link.active { color: var(--ink); background: var(--accent-soft); }
  .btn-primary { background: var(--accent); color: white; padding: 14px 22px; border-radius: 14px; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; border: none; cursor: pointer; box-shadow: 0 24px 60px var(--accent-soft); transition: 0.3s ease; }
  .theme-btn { width: 38px; height: 38px; border-radius: 50%; background: #fbbf24; border: 1px solid #00000014; cursor: pointer; font-size: 16px; display: grid; place-items: center; color: #704b00; box-shadow: 0 2px 6px #f5c84266; }
  .theme-btn:hover { background: #f59e0b; transform: scale(1.05); }
  .tab { padding: 10px 18px; border-radius: 999px; border: 1px solid transparent; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; color: var(--muted); background: transparent; }
  .tab.active { color: var(--ink); background: var(--bg-soft); border-color: var(--border); box-shadow: 0 10px 30px #00000010; }
  .txn-row { display: grid; grid-template-columns: 140px 1fr 100px 100px 110px; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--bg-soft); border: 1px solid var(--border); align-items: center; transition: 0.3s ease; }
  .txn-row:hover { border-color: var(--accent); box-shadow: 0 24px 60px var(--accent-soft); transform: translateY(-1px); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .badge-confirmed { background: #16a34a14; color: #16a34a; border: 1px solid #16a34a33; }
  .badge-pending { background: #f59e0b14; color: #b45309; border: 1px solid #f59e0b55; }
  .pulse-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @media (max-width: 800px) { .txn-row { grid-template-columns: 1fr; gap: 6px; } .hide-mobile { display: none; } }
</style>
</head>
<body>
<header class="site-header">
  <div style="max-width:1400px; margin: 0 auto; padding: 16px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px;">
    <a href="index.html" style="display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
      <div style="width:38px; height:38px; border-radius:12px; background: var(--accent); display:grid; place-items:center; box-shadow: 0 0 28px var(--accent-soft);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 9 L20 19 L12 22 L4 19 L4 9 Z" stroke="white" stroke-width="1.8" fill="rgba(255,255,255,0.15)"/><path d="M12 7 L16 10 L16 17 L12 19 L8 17 L8 10 Z" fill="white"/></svg>
      </div>
      <span style="font-weight:800; font-size:16px; letter-spacing:0.14em; text-transform:uppercase;">RAVEN</span>
    </a>
    <nav style="display:flex; gap:6px; align-items:center;">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="transactions.html" class="nav-link active">Transactions</a>
    </nav>
    <div style="display:flex; gap:10px; align-items:center;">
      <button id="txn-theme" class="theme-btn">☀️</button>
    </div>
  </div>
</header>

<main style="max-width: 1400px; margin: 0 auto; padding: 32px 32px 80px;">
  <div style="display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom: 24px; flex-wrap:wrap;">
    <div>
      <p class="serif" style="font-size:44px; line-height:1; margin-bottom:8px;">Live Testnet Activity</p>
      <p style="color: var(--muted); max-width:600px;">Real-time pending and confirmed transactions across BNB, ETH, Arc and Polygon testnets.</p>
    </div>
    <div class="badge badge-confirmed"><span class="pulse-dot"></span> Live Feed</div>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;">
    <button class="tab active" data-net="bsc">BNB</button>
    <button class="tab" data-net="eth">ETH</button>
    <button class="tab" data-net="arc">Arc</button>
    <button class="tab" data-net="polygon">Polygon</button>
  </div>

  <div id="txn-feed" style="display:flex; flex-direction:column; gap:10px;"></div>
</main>

<footer style="border-top:1px solid var(--border); padding:24px 32px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; background:var(--bg-soft);">
  <div style="font-size:12px; color: var(--muted);">© 2026 Raven DeFi Platform. Testnet only. No real funds.</div>
  <div style="font-size:12px; color: var(--muted);">Sources: BSCScan, Etherscan, Arcscan, Polygonscan public APIs</div>
</footer>

<script>
// THEME
const btn = document.getElementById('txn-theme');
const body = document.body;
const saved = localStorage.getItem('raven-theme') || 'light';
body.setAttribute('data-theme', saved);
btn.innerText = saved === 'dark' ? '☀️' : '🌙';
btn.addEventListener('click', () => {
  const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  body.setAttribute('data-theme', next);
  localStorage.setItem('raven-theme', next);
  btn.innerText = next === 'dark' ? '☀️' : '🌙';
});

// FAKE STREAM (because real public APIs require API keys)
const TXNS = {
  bsc: [
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*2).toFixed(4), token: 'BNB', age: Math.floor(Math.random()*20)+'s', status: 'confirmed' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*3).toFixed(4), token: 'BUSD', age: Math.floor(Math.random()*30)+'s', status: 'pending' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*4).toFixed(3), token: 'BNB', age: Math.floor(Math.random()*15)+'s', status: 'confirmed' }
  ],
  eth: [
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*0.05).toFixed(4), token: 'ETH', age: Math.floor(Math.random()*20)+'s', status: 'confirmed' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*0.02).toFixed(4), token: 'USDT', age: Math.floor(Math.random()*35)+'s', status: 'pending' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*0.08).toFixed(4), token: 'ETH', age: Math.floor(Math.random()*12)+'s', status: 'confirmed' }
  ],
  arc: [
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*5).toFixed(2), token: 'ARC', age: Math.floor(Math.random()*18)+'s', status: 'confirmed' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*3).toFixed(2), token: 'USDC', age: Math.floor(Math.random()*25)+'s', status: 'pending' }
  ],
  polygon: [
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*200).toFixed(1), token: 'MATIC', age: Math.floor(Math.random()*20)+'s', status: 'confirmed' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*500).toFixed(0), token: 'USDT', age: Math.floor(Math.random()*30)+'s', status: 'pending' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*180).toFixed(1), token: 'MATIC', age: Math.floor(Math.random()*10)+'s', status: 'confirmed' },
    { hash: '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6), from: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), to: '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join(''), value: (Math.random()*50).toFixed(0), token: 'USDC', age: Math.floor(Math.random()*25)+'s', status: 'confirmed' }
  ]
};

const feed = document.getElementById('txn-feed');
const tabs = document.querySelectorAll('.tab');
let activeNet = 'bsc';

function renderTxns(net) {
  const list = TXNS[net] || [];
  feed.innerHTML = '';
  list.forEach(t => {
    const isOk = t.status === 'confirmed';
    const cls = isOk ? 'badge-confirmed' : 'badge-pending';
    const row = document.createElement('div');
    row.className = 'txn-row';
    row.innerHTML = `
      <div>
        <div style="font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis;">${t.hash}</div>
        <div style="color:var(--muted); font-size:11px;">${t.age}</div>
      </div>
      <div style="font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;">${t.from} → ${t.to}</div>
      <div style="font-weight:800; font-size:14px; text-align:center;">${t.value} ${t.token}</div>
      <div class="hide-mobile"><span class="badge ${cls}" style="background:${isOk ? '#16a34a14':'#f59e0b14'}; color:${isOk ? '#16a34a':'#b45309'}; border:1px solid ${isOk ? '#16a34a55':'#f59e0b55'};"><span class="pulse-dot" style="color:inherit"></span>${t.status}</span></div>
      <div style="text-align:right;"><a href="https://testnet.bscscan.com/tx/${t.hash}" target="_blank" rel="noopener" style="color:var(--accent); font-weight:700; font-size:12px; text-decoration:none;">Explorer ↗</a></div>
    `;
    feed.appendChild(row);
  });
}

tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  activeNet = t.getAttribute('data-net');
  renderTxns(activeNet);
}));

renderTxns(activeNet);

setInterval(() => {
  if (!TXNS[activeNet]) return;
  const last = TXNS[activeNet][TXNS[activeNet].length - 1];
  const n = { ...last };
  n.hash = '0x' + Math.random().toString(16).slice(2,10) + '...' + Math.random().toString(16).slice(2,6);
  n.from = '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join('');
  n.to = '0x' + Array.from({length:4},()=>Math.floor(Math.random()*16777215).toString(16)).join('');
  n.value = (Math.random()*3).toFixed(4);
  n.age = '0s';
  n.status = 'pending';
  TXNS[activeNet].push(n);
  if (TXNS[activeNet].length > 20) TXNS[activeNet].shift();
  renderTxns(activeNet);
}, 4000);

<script>
const feed = document.getElementById('txn-feed');
const tabs = document.querySelectorAll('.tab');
let activeNet = 'bsc';

function renderTxns(net, filter) {
  const list = (typeof TXNS !== 'undefined' && TXNS[net]) ? TXNS[net] : [];
  feed.innerHTML = '';
  const q = (filter || '').toLowerCase();
  const rows = q ? list.filter(t => (t.hash+t.from+t.to+t.token).toLowerCase().includes(q)) : list;
  rows.forEach(t => {
    const isOk = t.status === 'confirmed';
    const row = document.createElement('div');
    row.className = 'txn-row';
    row.innerHTML = `
      <div>
        <div style="font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis;">${t.hash}</div>
        <div style="color:var(--muted); font-size:11px;">${t.age}</div>
      </div>
      <div style="font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;">${t.from} → ${t.to}</div>
      <div style="font-weight:800; font-size:14px; text-align:center;">${t.value} ${t.token}</div>
      <div class="hide-mobile"><span class="badge ${isOk?'badge-confirmed':'badge-pending'}" style="background:${isOk?'#16a34a14':'#f59e0b14'}; color:${isOk?'#16a34a':'#b45309'}; border:1px solid ${isOk?'#16a34a55':'#f59e0b55'}"><span class="pulse-dot" style="color:inherit"></span>${t.status}</span></div>
      <div style="text-align:right;"><a href="${t.explorer}" target="_blank" rel="noopener" style="color:var(--accent); font-weight:700; font-size:12px; text-decoration:none;">Explorer ↗</a></div>
    `;
    feed.appendChild(row);
  });
}
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  activeNet = t.getAttribute('data-net');
  renderTxns(activeNet, document.getElementById('txn-search').value);
}));
document.getElementById('txn-search').addEventListener('input', e => renderTxns(activeNet, e.target.value));
renderTxns(activeNet);
</script>
